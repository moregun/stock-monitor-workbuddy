name: Style Rotation Monitor (stock-monitor-workbuddy)

# 本工作流在本仓库内运行（main.py 位于 style_rotation/ 子目录）。
# 每日北京时间 08:30 自动运行，将结果写入 style_rotation/style_rotation_data.json 并 commit 回仓库，
# 这样 index.html 面板底部的「风格轮动监控」即可读取最新数据。
on:
  schedule:
    # UTC 时间 00:30 ≈ 北京时间 08:30（交易日开盘前）
    - cron: '30 0 * * *'
  workflow_dispatch: # 支持手动点击运行

jobs:
  run-monitor:
    runs-on: ubuntu-latest
    permissions:
      contents: write   # 用于把生成的 JSON 提交回仓库
    steps:
      - name: 拉取代码
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 设置 Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          pip install -r style_rotation/requirements.txt

      - name: 执行监控脚本
        working-directory: style_rotation
        run: python main.py

      - name: 提交数据回仓库
        run: |
          BRANCH="${GITHUB_REF_NAME}"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add style_rotation/style_rotation_data.json style_rotation/monitor_log.txt style_rotation/index_cache.json || true
          if git diff --cached --quiet; then
            echo "无变化"
            exit 0
          fi
          git commit -m "chore: update style rotation data"
          # 先 rebase 到最新远程再推送，避免与「更新股票监测数据」等工作流并发时 non-fast-forward 失败
          for attempt in 1 2 3; do
            git fetch origin "$BRANCH" || { echo "❌ 拉取远程失败"; exit 1; }
            if ! git pull --rebase origin "$BRANCH" 2>/dev/null; then
              echo "⚠️ rebase 冲突（第${attempt}次），以本地最新数据为准"
              git rebase --abort 2>/dev/null || true
              git rebase --strategy-option=theirs origin "$BRANCH" 2>/dev/null || git rebase --abort 2>/dev/null || true
            fi
            if git push origin "HEAD:${BRANCH}"; then
              echo "✅ 数据已提交并推送"
              exit 0
            fi
            echo "⚠️ 推送失败（第${attempt}次），稍后重试"
            sleep 30
          done
          echo "❌ 推送多次失败，请检查日志"
          exit 1

      - name: 上传结果制品
        uses: actions/upload-artifact@v4
        with:
          name: style-rotation-output
          path: |
            style_rotation/ratio_chart.png
            style_rotation/monitor_log.txt
            style_rotation/style_rotation_data.json
