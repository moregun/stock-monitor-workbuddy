name: Style Rotation Monitor

# 说明：本文件用于「独立新仓库」部署。
# 将 style_rotation/ 内的 main.py、requirements.txt 作为新仓库根目录文件，
# 并把 .github/ 放到新仓库根目录（即新仓库结构为 .github/workflows/monitor.yml + main.py + requirements.txt），
# 即可实现：每日北京时间 08:30 自动运行，并将结果数据提交回仓库（供面板读取）+ 下载制品。
on:
  schedule:
    # UTC 时间 00:30 ≈ 北京时间 08:30（交易日开盘前）
    - cron: '30 0 * * *'
  workflow_dispatch: # 支持手动点击运行

jobs:
  run-monitor:
    runs-on: ubuntu-latest
    permissions:
      contents: write   # 用于把生成的数据提交回仓库
    steps:
      - name: 拉取代码
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 设置 Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: 执行监控脚本
        run: python main.py

      - name: 提交数据回仓库
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add style_rotation_data.json monitor_log.txt index_cache.json || true
          git diff --cached --quiet && echo "无变化" || (git commit -m "chore: update style rotation data" && git push)

      - name: 上传结果制品
        uses: actions/upload-artifact@v4
        with:
          name: monitor-output
          path: |
            ratio_chart.png
            monitor_log.txt
            style_rotation_data.json
